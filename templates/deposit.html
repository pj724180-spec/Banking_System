{% extends "base.html" %}

{% block title %}Deposit{% endblock %}

{% block content %}

<div class="form-container">

    <h2>➕ Deposit Money</h2>

    <form method="POST">

        <label>Amount</label>

        <input type="number"
               name="amount"
               min="1"
               step="0.01"
               required>

        <button type="submit" class="btn">
            Deposit
        </button>

    </form>

</div>

{% endblock %}
